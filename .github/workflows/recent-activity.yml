name: Update Recent Activity

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

# All profile workflows write generated content to main. Keep them serialized.
concurrency:
  group: profile-contribution-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update recent GitHub activity
        uses: Readme-Workflows/recent-activity@v2.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
