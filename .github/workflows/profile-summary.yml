name: Generate Profile Summary Cards

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-summary.yml"
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

# All profile workflows write generated content to main. Keep them serialized.
concurrency:
  group: profile-contribution-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate dark profile summary
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          THEME: "tokyonight"
          AUTO_PUSH: false

      - name: Generate light profile summary
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          UTC_OFFSET: 8
          THEME: "vue"
          AUTO_PUSH: false

      - name: Commit and push cards
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-summary-card-output/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: update profile summary cards"
          git pull --rebase origin main
          git push origin HEAD:main
